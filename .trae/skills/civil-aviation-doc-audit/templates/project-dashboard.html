<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目总览 — 民航施工资料审核</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* ================================================================
       页面专属变量（共享令牌见 tokens.css）
    ================================================================ */
    :root {
      --font-size-xs: 11px;
      --font-size-sm: 12px;
      --font-size-base: 13px;
      --font-size-md: 14px;
      --font-size-lg: 16px;
      --font-size-xl: 20px;
      --font-size-2xl: 28px;

      --transition-fast: 0.12s ease;
      --transition-base: 0.18s ease;
    }

    /* ========== Reset & Base ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font-ui);
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      background: var(--color-bg-app);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ========== Buttons & Inputs ========== */
    button, .btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--font-ui);
      font-size: var(--font-size-sm);
      font-weight: 500;
      padding: 6px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      user-select: none;
      line-height: 1.4;
    }
    button:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    button.primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
    button.primary:hover:not(:disabled) { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
    button.ghost { border-color: transparent; background: transparent; color: var(--color-text-secondary); }
    button.ghost:hover:not(:disabled) { background: #f1f5f9; color: var(--color-text-primary); }

    input[type="file"] { font-family: var(--font-ui); font-size: var(--font-size-sm); }

    /* ========== Top Bar ========== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px;
      padding: 10px 24px;
      background: var(--color-bg-header);
      color: var(--color-text-inverse);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      min-height: 48px;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 8px;
      font-size: var(--font-size-md);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .topbar-brand .icon {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: var(--color-accent);
      border-radius: var(--radius-sm);
      font-size: 15px;
    }
    .topbar-brand .project-name {
      color: #fbbf24;
      font-weight: 500;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-meta {
      display: flex; align-items: center; gap: 12px;
      margin-left: auto;
      font-size: var(--font-size-xs);
      color: #94a3b8;
    }
    .stage-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: var(--font-size-xs);
      font-weight: 600;
      background: #1e3a5f;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stage-badge::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #60a5fa;
    }

    /* ========== Main Content ========== */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ========== Stats Grid ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition-fast), border-color var(--transition-fast);
    }
    .stat-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .stat-card .stat-value {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-card .stat-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-card.total .stat-value    { color: var(--color-text-primary); }
    .stat-card.completed .stat-value { color: var(--color-success); }
    .stat-card.alerts .stat-value    { color: var(--color-danger); }
    .stat-card.suspects .stat-value  { color: var(--color-warning); }
    .stat-card.pending .stat-value   { color: var(--color-accent); }

    .stat-sub {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      margin-top: 2px;
    }
    .stat-sub .pct { font-weight: 600; color: var(--color-text-secondary); }

    /* ========== Section Header ========== */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-header h2 {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-text-primary);
      display: flex; align-items: center; gap: 8px;
    }
    .section-header h2 .count {
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
    }

    /* ========== Document Table ========== */
    .table-wrap {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    table.doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-size-sm);
    }
    table.doc-table thead {
      background: #f8fafc;
      border-bottom: 2px solid var(--color-border);
    }
    table.doc-table th {
      padding: 8px 14px;
      text-align: left;
      font-weight: 600;
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    table.doc-table td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--color-border-light);
      vertical-align: middle;
      line-height: 1.4;
    }
    table.doc-table tbody tr { transition: background var(--transition-fast); }
    table.doc-table tbody tr:hover { background: #f8fafc; }
    table.doc-table tbody tr:last-child td { border-bottom: none; }
    table.doc-table td.file-name {
      font-weight: 500;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    table.doc-table td.mono {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    /* ========== Badges ========== */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge::before {
      content: "";
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-completed  { background: var(--color-success-light); color: #0f766e; }
    .badge-completed::before  { background: var(--color-success); }
    .badge-needs-review { background: var(--color-warning-light); color: #92400e; }
    .badge-needs-review::before { background: var(--color-warning); }
    .badge-pending    { background: #f1f5f9; color: #64748b; }
    .badge-pending::before    { background: #94a3b8; }
    .badge-unsupported { background: #f1f5f9; color: #94a3b8; }
    .badge-unsupported::before { background: #cbd5e1; }
    .badge-verified   { background: var(--color-success-light); color: #0f766e; }
    .badge-verified::before   { background: var(--color-success); }
    .badge-unverified { background: #f8fafc; color: #94a3b8; }
    .badge-unverified::before { background: #cbd5e1; }

    .alert-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: var(--font-size-xs);
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .alert-badge.has-alerts { color: var(--color-danger); }
    .alert-badge.no-alerts  { color: var(--color-text-tertiary); }

    /* ========== Gaps Section ========== */
    .gaps-section {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .gaps-section .gaps-header {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; gap: 8px;
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .gap-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--color-border-light);
      font-size: var(--font-size-sm);
    }
    .gap-item:last-child { border-bottom: none; }
    .gap-icon {
      flex-shrink: 0;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-warning-light);
      color: var(--color-warning);
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
    }
    .gap-text { flex: 1; color: var(--color-text-primary); }
    .gap-type {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
    }

    /* ========== Rescan Section (v7.2 C4) ========== */
    .rescan-section {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .rescan-section .rescan-header {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; gap: 8px;
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .rescan-header .rescan-title { color: var(--color-warning); }
    .rescan-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--color-border-light);
      font-size: var(--font-size-sm);
    }
    .rescan-item:last-child { border-bottom: none; }
    .rescan-rank {
      flex-shrink: 0;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-warning-light);
      color: var(--color-warning);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .rescan-text { flex: 1; color: var(--color-text-primary); min-width: 0; }
    .rescan-text .rescan-file {
      display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rescan-text .rescan-sub {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }
    .rescan-meta {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
      text-align: right;
      flex-shrink: 0;
    }
    .rescan-empty {
      padding: 16px;
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-sm);
    }

    /* ========== Actions Bar ========== */
    .actions-bar {
      display: flex; gap: 8px;
      padding: 16px 0;
      border-top: 1px solid var(--color-border);
      margin-top: 16px;
    }
    .actions-bar a { text-decoration: none; }

    /* ========== Overlay / Dialog ========== */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.15s ease;
    }
    .overlay.hidden { display: none; }
    .overlay .dialog {
      background: var(--color-bg-surface);
      padding: 28px 32px;
      border-radius: var(--radius-lg);
      max-width: 560px;
      width: 90%;
      box-shadow: var(--shadow-overlay);
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.2s ease;
    }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .overlay h3 { font-size: var(--font-size-lg); margin-bottom: 12px; font-weight: 700; }
    .overlay p  { margin: 6px 0; font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.6; }
    .overlay ul { margin: 8px 0; }
    .overlay li { margin: 4px 0; }
    .overlay .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ========== Toast ========== */
    .toast {
      position: fixed; top: 60px; right: 20px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      font-size: var(--font-size-sm);
      font-weight: 500;
      max-width: 380px;
      opacity: 0;
      transform: translateX(16px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      background: #1e293b;
      color: #fff;
    }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.success { background: var(--color-success); }
    .toast.error   { background: var(--color-danger); }

    /* ========== Empty State ========== */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 56px 24px;
      color: var(--color-text-tertiary);
      text-align: center;
      gap: 8px;
    }
    .empty-state .empty-icon { font-size: 36px; opacity: 0.4; margin-bottom: 8px; }
    .empty-state .empty-title { font-size: var(--font-size-md); font-weight: 600; color: var(--color-text-secondary); }
    .empty-state .empty-desc { font-size: var(--font-size-sm); max-width: 360px; line-height: 1.5; }

    /* ========== Scrollbar ========== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ========== Responsive ========== */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .main-content { padding: 16px; }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="icon">&#128202;</span>
      <span>项目总览</span>
      <span class="project-name" id="project-name">—</span>
    </div>
    <div class="topbar-meta">
      <span class="stage-badge" id="stage-badge">—</span>
      <span>更新于 <span id="updated-at">—</span></span>
      <button id="btn-load-dir" title="选择项目文件夹">选择文件夹</button>
      <button id="btn-refresh" class="ghost" title="刷新">刷新</button>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main-content">
    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">文件总数</div>
      </div>
      <div class="stat-card completed">
        <div class="stat-value" id="stat-completed">—</div>
        <div class="stat-label">OCR 完成</div>
        <div class="stat-sub">完成率 <span class="pct" id="stat-completed-pct">—</span></div>
      </div>
      <div class="stat-card alerts">
        <div class="stat-value" id="stat-alerts">—</div>
        <div class="stat-label">质量告警</div>
      </div>
      <div class="stat-card suspects">
        <div class="stat-value" id="stat-suspects">—</div>
        <div class="stat-label">OCR 存疑</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-value" id="stat-pending">—</div>
        <div class="stat-label">待人工核对</div>
        <div class="stat-sub">已核对 <span class="pct" id="stat-verified">—</span></div>
      </div>
    </div>

    <!-- 文档列表 -->
    <div class="section-header">
      <h2>文档清单 <span class="count" id="doc-count">(0)</span></h2>
    </div>
    <div class="table-wrap">
      <div style="overflow-x:auto;">
        <table class="doc-table">
          <thead>
            <tr>
              <th>编号</th>
              <th>原始文件</th>
              <th>专业</th>
              <th>类型</th>
              <th>页数</th>
              <th>OCR 引擎</th>
              <th>置信度</th>
              <th>OCR 状态</th>
              <th>核对状态</th>
              <th>告警 / 存疑</th>
            </tr>
          </thead>
          <tbody id="doc-table-body">
            <tr><td colspan="10">
              <div class="empty-state">
                <div class="empty-icon">&#128194;</div>
                <div class="empty-title">尚未加载数据</div>
                <div class="empty-desc">请点击上方"选择文件夹"加载数据底座的 index.json，或手动选择文件</div>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 断档检测 -->
    <div class="gaps-section" id="gaps-section" style="display:none;">
      <div class="gaps-header">
        断档检测 <span style="font-weight:400;color:var(--color-text-tertiary);">(<span id="gaps-count">0</span> 项)</span>
      </div>
      <div id="gaps-list"></div>
    </div>

    <!-- v7.2 C4: 建议重扫 TOP 10（仅对 extraction_mode="ocr" 的低置信度文件，纯文字提示不强制） -->
    <div class="rescan-section" id="rescan-section" style="display:none;">
      <div class="rescan-header">
        <span class="rescan-title">建议重扫 TOP 10</span>
        <span style="font-weight:400;color:var(--color-text-tertiary);text-transform:none;letter-spacing:0;">
          （按 (1−OCR置信度) × 关联Fatal规则条数估算值 排序，仅提示不强制）
        </span>
      </div>
      <div id="rescan-list"></div>
    </div>

    <!-- 操作区 -->
    <div class="actions-bar">
      <a href="./数据核对编辑器.html" class="btn primary">打开数据编辑器</a>
      <button id="btn-manual-load" class="ghost">手动选择 index.json</button>
    </div>

    <!-- 手动加载文件输入 -->
    <input type="file" id="index-file-input" accept=".json" style="display:none">
    <div style="margin-top:12px;font-size:11px;color:var(--color-text-tertiary);">
      提示：也可通过本地 HTTP 服务器打开本页面，系统将自动尝试加载 <code>数据底座/index.json</code>
    </div>
  </main>

  <!-- 对话框遮罩 -->
  <div class="overlay hidden" id="overlay">
    <div class="dialog" id="overlay-dialog"></div>
  </div>

  <!-- 提示消息 -->
  <div class="toast" id="toast"></div>

  <script>
    /* ========================================================================
       Project Dashboard — 项目总览
       Phase 2 完整实现
    ========================================================================= */

    const state = {
      index: null,
      dirHandle: null,
      foundationDirHandle: null,
      loadMode: null,
    };

    // ========== Utilities ==========
    function showToast(message, type = 'info', duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      setTimeout(() => { toast.className = 'toast ' + type; }, duration);
    }

    function showDialog(html) {
      document.getElementById('overlay-dialog').innerHTML = html;
      document.getElementById('overlay').classList.remove('hidden');
    }

    function hideDialog() {
      document.getElementById('overlay').classList.add('hidden');
    }

    window.hideDialog = hideDialog;

    // ========== Init ==========
    async function init() {
      // 尝试 fetch 自动加载（仅本地 HTTP 服务器下有效）
      try {
        const response = await fetch('./数据底座/index.json', { cache: 'no-store' });
        if (response.ok) {
          state.index = await response.json();
          state.loadMode = 'fetch';
          showToast('已通过本地服务器加载数据', 'success');
          render();
          return;
        }
      } catch (e) {
        // file:// 协议下 fetch 被 CORS 拦截属于正常现象，不弹错误
        if (location.protocol !== 'file:') {
          console.log('fetch 加载失败', e);
        }
      }

      // file:// 协议下：不弹对话框，让用户点击已有的「选择文件夹」按钮
      showToast('请点击顶部工具栏「选择文件夹」加载数据底座', 'info', 4000);
    }

    // ========== Directory Picker ==========
    window.pickDirectory = pickDirectory;

    async function pickDirectory() {
      try {
        const dirHandle = await window.showDirectoryPicker();
        state.dirHandle = dirHandle;

        let foundationDir = await dirHandle.getDirectoryHandle('数据底座').catch(() => null);
        let indexFileHandle;
        let loadModeLabel = '';

        if (foundationDir && foundationDir !== dirHandle) {
          indexFileHandle = await foundationDir.getFileHandle('index.json').catch(() => null);
          loadModeLabel = '（检测到 数据底座/ 子目录）';
        } else {
          indexFileHandle = await dirHandle.getFileHandle('index.json').catch(() => null);
          if (indexFileHandle) {
            foundationDir = dirHandle;
            loadModeLabel = '（直接选择数据底座目录）';
          }
        }

        if (!indexFileHandle) {
          showToast('未找到 index.json。请选择包含 index.json 的目录，或包含"数据底座/"子目录的项目根目录', 'error', 5000);
          return;
        }

        const file = await indexFileHandle.getFile();
        state.index = JSON.parse(await file.text());
        state.foundationDirHandle = foundationDir;
        state.loadMode = 'dirHandle';
        showToast('成功加载项目数据 ' + loadModeLabel, 'success');
        render();
      } catch (e) {
        if (e.name !== 'AbortError') {
          showToast('选择目录失败：' + e.message, 'error');
        }
      }
    }

    // ========== Manual file input ==========
    document.getElementById('index-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          state.index = JSON.parse(ev.target.result);
          state.loadMode = 'manual';
          showToast('index.json 已加载', 'success');
          render();
        } catch (err) {
          showToast('解析失败：' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('btn-manual-load').addEventListener('click', () => {
      document.getElementById('index-file-input').click();
    });

    document.getElementById('btn-load-dir').addEventListener('click', () => {
      if (window.showDirectoryPicker) {
        pickDirectory();
      } else {
        document.getElementById('index-file-input').click();
      }
    });

    document.getElementById('btn-refresh').addEventListener('click', async () => {
      if (state.dirHandle) {
        try {
          const fileHandle = await state.dirHandle.getFileHandle('index.json');
          const file = await fileHandle.getFile();
          const text = await file.text();
          state.index = JSON.parse(text);
          render();
          showToast('已刷新', 'success');
        } catch (e) {
          showToast('刷新失败: ' + e.message, 'error');
        }
      } else {
        init();
      }
    });

    // ========== Render ==========
    function render() {
      const data = state.index;
      if (!data) return;

      // Project info
      document.getElementById('project-name').textContent = data.project_name || '未命名项目';
      const stage = data.stage || 'unknown';
      const stageEl = document.getElementById('stage-badge');
      stageEl.textContent = stage.replace(/_/g, ' ');
      document.getElementById('updated-at').textContent = (data.updated_at || '—').replace('T', ' ').substring(0, 19);

      // Stats
      const docs = data.documents || [];
      const total = docs.length;
      const completed = docs.filter(d => d.ocr_status === 'completed').length;
      const needsReview = docs.filter(d => d.ocr_status === 'needs_review').length;
      const ocrDone = completed + needsReview;
      const alerts = docs.reduce((s, d) => s + (d.quality_alerts || 0), 0);
      const suspects = docs.reduce((s, d) => s + (d.confusion_suspects || 0), 0);
      const verified = docs.filter(d => d.human_verified).length;
      const pending = total - verified;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-completed').textContent = ocrDone;
      document.getElementById('stat-completed-pct').textContent = total > 0 ? (ocrDone / total * 100).toFixed(0) + '%' : '—';
      document.getElementById('stat-alerts').textContent = alerts;
      document.getElementById('stat-suspects').textContent = suspects;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-verified').textContent = verified + '/' + total;
      document.getElementById('doc-count').textContent = '(' + total + ')';

      // Document table
      const tbody = document.getElementById('doc-table-body');
      if (docs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#128194;</div><div class="empty-title">暂无文档</div><div class="empty-desc">数据底座中尚未收录任何文档</div></div></td></tr>';
      } else {
        tbody.innerHTML = docs.map(d => {
          const ocrStatus = d.ocr_status || 'pending';
          const verifiedStatus = d.human_verified ? 'verified' : 'unverified';
          const alertCount = d.quality_alerts || 0;
          const suspectCount = d.confusion_suspects || 0;
          const hasIssues = alertCount > 0 || suspectCount > 0;

          return `
            <tr>
              <td class="mono">${d.id || '—'}</td>
              <td class="file-name" title="${d.original_file || ''}">${d.original_file || '—'}</td>
              <td>${d.professional || '—'}</td>
              <td>${d.doc_type || '—'}</td>
              <td class="mono">${d.pages || '—'}</td>
              <td>${d.ocr_engine || '—'}</td>
              <td class="mono">${(() => {
                // v7.2 C3: 电子表/非扫描PDF 显示"免OCR"，不谎报 OCR%
                const m = d.extraction_mode;
                if (m === 'meta_xlsx') return '免OCR';
                if (m === 'text_pdf') return '免OCR';
                if (m === 'docx') return '免OCR';
                if (m === 'reference_skip') return '免OCR';
                return d.ocr_confidence ? (d.ocr_confidence * 100).toFixed(1) + '%' : '—';
              })()}</td>
              <td>${statusBadge(ocrStatus)}</td>
              <td>${verifiedBadge(verifiedStatus)}</td>
              <td>
                <span class="alert-badge ${hasIssues ? 'has-alerts' : 'no-alerts'}">
                  ${alertCount} / ${suspectCount}
                </span>
              </td>
            </tr>
          `;
        }).join('');
      }

      // Gaps
      const gaps = data.gaps || [];
      const gapsSection = document.getElementById('gaps-section');
      if (gaps.length > 0) {
        gapsSection.style.display = 'block';
        document.getElementById('gaps-count').textContent = gaps.length;
        document.getElementById('gaps-list').innerHTML = gaps.map(g => `
          <div class="gap-item">
            <span class="gap-icon">!</span>
            <span class="gap-text">${g.description || g.type || '未知断档'}</span>
            <span class="gap-type">${g.professional || ''} ${g.type || ''}</span>
          </div>
        `).join('');
      } else {
        gapsSection.style.display = 'none';
      }

      // v7.2 C4: 建议重扫 TOP 10
      renderRescanTop10(docs);
    }

    // ========== v7.2 C4: 建议重扫 TOP 10 ==========
    // 仅对 extraction_mode="ocr" 的文件（向后兼容：缺失字段默认 "ocr"）
    // 按公式 (1 - ocr_confidence) * 该文件关联 Fatal 规则条数估算值 排序
    // Fatal 规则条数估算值：用 quality_alerts + confusion_suspects 作为代理指标
    //   （这两项是 build_foundation.py 检测到的数据质量告警和 OCR 混淆存疑数，
    //    与 Fatal 规则触发概率正相关）
    // 纯文字提示，不强制
    function renderRescanTop10(docs) {
      const rescanSection = document.getElementById('rescan-section');
      const rescanList = document.getElementById('rescan-list');
      if (!rescanSection || !rescanList) return;

      // 仅筛选 extraction_mode="ocr" 的文件（向后兼容：缺失字段默认 "ocr"）
      const ocrDocs = docs.filter(d => {
        const mode = d.extraction_mode || 'ocr';
        return mode === 'ocr';
      });

      // 筛选 ocr_confidence < 0.85 的文件（向后兼容：缺失字段默认 1.0）
      const OCR_THRESHOLD = 0.85;
      const lowConfDocs = ocrDocs.filter(d => {
        const conf = typeof d.ocr_confidence === 'number' ? d.ocr_confidence : 1.0;
        return conf < OCR_THRESHOLD;
      });

      if (lowConfDocs.length === 0) {
        rescanSection.style.display = 'none';
        return;
      }

      // 按公式排序：(1 - ocr_confidence) * 该文件关联 Fatal 规则条数估算值
      // Fatal 规则条数估算值 = quality_alerts + confusion_suspects（数据质量问题数 + OCR 混淆存疑数）
      const ranked = lowConfDocs.map(d => {
        const conf = typeof d.ocr_confidence === 'number' ? d.ocr_confidence : 1.0;
        const fatalEstimate = (d.quality_alerts || 0) + (d.confusion_suspects || 0);
        const score = (1 - conf) * fatalEstimate;
        return { doc: d, score, fatalEstimate, conf };
      }).sort((a, b) => b.score - a.score).slice(0, 10);

      rescanSection.style.display = 'block';
      rescanList.innerHTML = ranked.map((item, idx) => {
        const d = item.doc;
        const confPct = (item.conf * 100).toFixed(1);
        const fileName = d.original_file || d.id || '—';
        const docType = d.doc_type || '未知类型';
        const professional = d.professional || '';
        const subLine = [docType, professional].filter(Boolean).join(' · ');
        return `
          <div class="rescan-item">
            <span class="rescan-rank">${idx + 1}</span>
            <span class="rescan-text">
              <span class="rescan-file" title="${fileName}">${fileName}</span>
              <span class="rescan-sub">${subLine}</span>
            </span>
            <span class="rescan-meta">
              OCR ${confPct}%<br>
              估算Fatal ${item.fatalEstimate} · 评分 ${item.score.toFixed(2)}
            </span>
          </div>
        `;
      }).join('');
    }

    function statusBadge(status) {
      const map = {
        'completed':    ['badge-completed', '已完成'],
        'needs_review': ['badge-needs-review', '需复核'],
        'unsupported':  ['badge-unsupported', '不支持'],
        'pending':      ['badge-pending', '待处理'],
      };
      const [cls, label] = map[status] || ['badge-pending', status || '未知'];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function verifiedBadge(status) {
      if (status === 'verified') return '<span class="badge badge-verified">已核对</span>';
      return '<span class="badge badge-unverified">未核对</span>';
    }

    // ========== Start ==========
    init();
  </script>
</body>
</html>
